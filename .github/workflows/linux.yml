name: Linux CI

on:
  push:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        arch: [x64, arm64]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v1
        with:
          submodules: 'recursive'
      - name: "Install .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: "Build Project"
        run: dotnet publish FRESHMusicPlayer/FRESHMusicPlayer.Linux/FRESHMusicPlayer.Linux.csproj -c Release -r linux-${{ matrix.arch }} --self-contained
      - uses: actions/upload-artifact@v4
        name: "Upload Artifact"
        with:
          name: "freshmusicplayer-linux-${{ matrix.arch }}"                        
          path: "FRESHMusicPlayer/FRESHMusicPlayer.Linux/bin/Release/net10.0/linux-${{ matrix.arch }}/publish"